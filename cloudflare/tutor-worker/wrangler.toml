name = "study-scoop-ai-tutor-pilot"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
ALLOWED_ORIGINS = "https://bazeocrisy.github.io"
AI_ENABLED = "false"
# Set MODEL to a verified, available Anthropic model before enabling AI.

[[durable_objects.bindings]]
name = "TUTOR_SESSIONS"
class_name = "TutorSessions"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TutorSessions"]

# Secrets: SESSION_SIGNING_SECRET (>=32 random characters), ANTHROPIC_API_KEY.
# No routes: deployment requires owner-approved hostname and access configuration.
